name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r dev-requirements.txt
      - name: Run Ruff
        run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-gobject-introspection
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libglib2.0-dev \
            python3-gi \
            python3-gi-cairo \
            python3-dev \
            gobject-introspection \
            gir1.2-gtk-4.0 \
            gir1.2-gtksource-5 \
            meson \
            xvfb
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gtk4 gtksourceview5 gobject-introspection cairo meson pkg-config
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        if: runner.os != 'Windows'
        run: |
          pip install -r dev-requirements.txt
      - name: Build PyGObject from source (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install --no-binary :all: pycairo PyGObject
      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        shell: ucrt64 {0}
        run: |
          pip install -r dev-requirements.txt
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: ucrt64 {0}
        env:
          GDK_BACKEND: windows
          NO_AT_BRIDGE: 1
        run: |
          pytest -v
      - name: Run tests (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages:$PYTHONPATH xvfb-run pytest -v
      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: |
          export DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib
          pytest -v
