name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r dev-requirements.txt
      - name: Run Ruff
        run: ruff check .

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libglib2.0-dev \
            python3-gi \
            python3-gi-cairo \
            python3-dev \
            gobject-introspection \
            gir1.2-gtk-4.0 \
            gir1.2-gtksourceview-5 \
            meson \
            xvfb
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gtk4 gtksourceview5 gobject-introspection pygobject3 cairo meson pkg-config
      - name: Set up Python (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Python (macOS)
        if: runner.os == 'macOS'
        run: |
          # Use Homebrew's Python so gi bindings are importable
          echo "Python=/usr/local/bin/python3" >> $GITHUB_ENV
          echo "/usr/local/bin" >> $GITHUB_PATH
      - name: Install Python dependencies
        run: |
          pip install -r dev-requirements.txt
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run pytest -v
      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: python3 -m pytest -v
