name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libglib2.0-dev \
            python3-gi \
            python3-gi-cairo \
            python3-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            gir1.2-gtk-4.0 \
            gir1.2-gtksource-5 \
            meson

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure PyGObject pkg-config for meson build
        run: |
          pip install meson
          pip install --no-binary :all: pycairo PyGObject

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
