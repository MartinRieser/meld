name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libglib2.0-dev \
            python3-gi \
            python3-gi-cairo \
            python3-cairo-dev \
            python3-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            gir1.2-gtk-4.0 \
            gir1.2-gtksource-5 \
            gettext \
            meson

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install build

      - name: Build wheel and sdist
        run: |
          # pygobject-3.0.pc is not shipped by Ubuntu's python3-gi package.
          # Create a minimal stub so meson's version check passes. The
          # actual gi Python module is already installed system-wide.
          cat > /tmp/pygobject-3.0.pc << 'EOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include

          Name: PyGObject
          Description: Python GObject bindings
          Version: 3.46.0
          Libs:
          Cflags:
          EOF
          sudo cp /tmp/pygobject-3.0.pc /usr/lib/x86_64-linux-gnu/pkgconfig/
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
