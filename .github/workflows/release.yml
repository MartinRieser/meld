name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  python-package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libglib2.0-dev \
            python3-gi \
            python3-gi-cairo \
            python3-cairo-dev \
            python3-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            gir1.2-gtk-4.0 \
            gir1.2-gtksource-5 \
            gettext \
            desktop-file-utils \
            meson

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: pip install build

      - name: Build wheel and sdist
        run: |
          cat > /tmp/pygobject-3.0.pc << 'EOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include
          Name: PyGObject
          Description: Python GObject bindings
          Version: 3.46.0
          Libs:
          Cflags:
          EOF
          sudo cp /tmp/pygobject-3.0.pc /usr/lib/x86_64-linux-gnu/pkgconfig/
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meld-python-dist
          path: dist/

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    needs: [python-package]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-desktop-file-utils
            mingw-w64-ucrt-x86_64-gsettings-desktop-schemas
            mingw-w64-ucrt-x86_64-gtk-update-icon-cache
            mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-python-packaging
            mingw-w64-ucrt-x86_64-itstool

      - name: Install Python dependencies
        run: pip install --no-build-isolation pyinstaller-versionfile

      - name: Build and package with PyInstaller and NSIS
        run: |
          meson setup build .
          meson compile -v -C build
          DESTDIR=$PWD/build/inst meson install -C build
          INST_ROOT=$(find $PWD/build/inst -name "meld" -path "*/bin/meld" -exec dirname {} \;)
          INST_ROOT=$(dirname "$INST_ROOT")
          echo "Install root: $INST_ROOT"
          cp "$GITHUB_WORKSPACE/windows/meld.spec" "$INST_ROOT/"
          cp "$GITHUB_WORKSPACE/windows/meld.nsis" "$INST_ROOT/"
          cd "$INST_ROOT"
          python -m PyInstaller meld.spec
          cp version.nsh dist/
          cp "$GITHUB_WORKSPACE/windows/meld.nsis" dist/
          cd dist
          makensis ./meld.nsis
          mv meld-*.exe "$GITHUB_WORKSPACE/"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: meld-windows-x86_64
          path: meld-*.exe

  macos:
    name: macOS (arm64)
    runs-on: macos-14
    needs: [python-package]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew update
          brew install gtk4 gtksourceview5 gobject-introspection cairo meson pkg-config librsvg itstool desktop-file-utils

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build PyGObject from source
        run: |
          pip install --no-binary :all: pycairo PyGObject

      - name: Install packaging dependencies
        run: pip install pyinstaller

      - name: Build and install Meld
        run: |
          BREW_PREFIX=$(brew --prefix)
          export PKG_CONFIG_PATH="$BREW_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          for stub in pygobject-3.0 py3cairo; do
            cat > /tmp/$stub.pc << EOF
          prefix=/usr
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include
          Name: $stub
          Description: Python GObject bindings
          Version: 3.46.0
          Libs:
          Cflags:
          EOF
            sudo cp /tmp/$stub.pc "$BREW_PREFIX/lib/pkgconfig/"
          done
          meson setup --prefix=/ build
          meson compile -v -C build
          meson install -C build --destdir=install
          INST_ROOT=$(find $PWD/build/install -name "meld" -path "*/bin/meld" -exec dirname {} \;)
          INST_ROOT=$(dirname "$INST_ROOT")
          echo "INST_ROOT=$INST_ROOT" >> $GITHUB_ENV

      - name: Generate .icns icon
        run: |
          mkdir -p meld.iconset
          for size in 16 32 128 256 512; do
            rsvg-convert -w $size -h $size \
              data/icons/hicolor/scalable/apps/org.gnome.Meld.svg \
              -o meld.iconset/icon_${size}x${size}.png
            rsvg-convert -w $((size*2)) -h $((size*2)) \
              data/icons/hicolor/scalable/apps/org.gnome.Meld.svg \
              -o meld.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns meld.iconset -o meld.icns
          cp meld.icns $INST_ROOT/

      - name: Package with PyInstaller
        run: |
          cp macos/meld.spec "$INST_ROOT/"
          cd "$INST_ROOT"
          export DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib
          pyinstaller ./meld.spec

      - name: Create DMG
        id: dmg
        run: |
          brew install create-dmg
          VERSION_TAG="${{ github.ref_name }}"
          VERSION="${VERSION_TAG#v}"
          DMG_NAME="Meld-${VERSION}-macOS-arm64.dmg"
          mkdir -p dmg-root
          cp -R "$INST_ROOT/dist/Meld.app" dmg-root/
          create-dmg \
            --volname "Meld $VERSION" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "$DMG_NAME" \
            "dmg-root/"
          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: meld-macos-arm64
          path: ${{ steps.dmg.outputs.dmg_name }}

  ubuntu-deb:
    name: Ubuntu (amd64)
    runs-on: ubuntu-latest
    needs: [python-package]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libglib2.0-dev \
            python3-gi \
            python3-gi-cairo \
            python3-cairo-dev \
            python3-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            gir1.2-gtk-4.0 \
            gir1.2-gtksource-5 \
            gir1.2-pango-1.0 \
            gir1.2-pangocairo-1.0 \
            gsettings-desktop-schemas \
            gettext \
            desktop-file-utils \
            itstool \
            libxml2-utils \
            meson

      - name: Build and install to DESTDIR
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          VERSION="${VERSION_TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          cat > /tmp/pygobject-3.0.pc << 'EOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include
          Name: PyGObject
          Description: Python GObject bindings
          Version: 3.46.0
          Libs:
          Cflags:
          EOF
          sudo cp /tmp/pygobject-3.0.pc /usr/lib/x86_64-linux-gnu/pkgconfig/

          meson setup --prefix=/usr build
          meson compile -v -C build
          DESTDIR=/tmp/meld-deb meson install -C build

      - name: Build .deb package
        run: |
          mkdir -p /tmp/meld-deb/DEBIAN

          cat > /tmp/meld-deb/DEBIAN/control << DEBCONTROL
          Package: meld
          Version: ${{ env.VERSION }}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Meld Project <kai.willadsen@gmail.com>
          Depends: python3 (>= 3.10),
                   python3-gi (>= 3.30),
                   python3-gi-cairo,
                   python3-cairo (>= 1.15),
                   gir1.2-gtk-4.0 (>= 4.0),
                   gir1.2-gtksourceview-5 (>= 5.0),
                   gir1.2-pango-1.0,
                   gir1.2-pangocairo-1.0,
                   gsettings-desktop-schemas,
                   libglib2.0-0 (>= 2.48)
          Provides: meld
          Replaces: meld (<< 3.22)
          Description: Visual diff and merge tool
           Meld is a visual diff and merge tool targeted at developers.
           Meld helps you compare files, directories, and version controlled
           projects. It provides two- and three-way comparison of both files
           and directories, and supports many version control systems.
          Homepage: https://meld.app
          DEBCONTROL

          cat > /tmp/meld-deb/DEBIAN/postinst << 'POSTINST'
          #!/bin/sh
          set -e
          if [ "$1" = "configure" ]; then
              glib-compile-schemas /usr/share/glib-2.0/schemas/ 2>/dev/null || true
              gtk-update-icon-cache -f -t /usr/share/icons/hicolor/ 2>/dev/null || true
              update-desktop-database 2>/dev/null || true
          fi
          POSTINST
          chmod 755 /tmp/meld-deb/DEBIAN/postinst

          cat > /tmp/meld-deb/DEBIAN/postrm << 'POSTRM'
          #!/bin/sh
          set -e
          if [ "$1" = "remove" ]; then
              glib-compile-schemas /usr/share/glib-2.0/schemas/ 2>/dev/null || true
              gtk-update-icon-cache -f -t /usr/share/icons/hicolor/ 2>/dev/null || true
              update-desktop-database 2>/dev/null || true
          fi
          POSTRM
          chmod 755 /tmp/meld-deb/DEBIAN/postrm

          dpkg-deb --build /tmp/meld-deb /tmp/meld-${{ env.VERSION }}_amd64.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: meld-ubuntu-amd64
          path: /tmp/meld-*.deb

  release:
    needs: [python-package, windows, macos, ubuntu-deb]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: meld-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
